<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="weather.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>🌦️ Weather Dashboard</h1>
            <p>Discover the weather anywhere in the world</p>
        </header>

        <div class="search-box">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
            >
            <button id="searchBtn" onclick="getWeather()">
                Search
            </button>
        </div>

        <p id="message"></p>

        <div class="weather-card" id="weatherCard">

            <h2 id="cityName">Chennai</h2>

            <div class="weather-icon" id="weatherIcon">🌤️</div>

            <h1 id="temperature">--°C</h1>

            <h3 id="description">Search for a city</h3>

            <div class="details">

                <div class="detail-box">
                    <span>💧</span>
                    <h3 id="humidity">--%</h3>
                    <p>Humidity</p>
                </div>

                <div class="detail-box">
                    <span>💨</span>
                    <h3 id="wind">-- km/h</h3>
                    <p>Wind Speed</p>
                </div>

                <div class="detail-box">
                    <span>🌡️</span>
                    <h3 id="feelsLike">--°C</h3>
                    <p>Feels Like</p>
                </div>

            </div>

        </div>

        <footer>
            <p>Weather Dashboard | Powered by Open-Meteo API</p>
        </footer>

    </div>

    <script src="weather.js"></script>
</body>
</html>
